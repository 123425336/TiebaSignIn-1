# 每天6:30执行

name: Start

on:
   push:
   gollum:
   workflow_dispatch:  # 允许在 Actions 页面手动触发，方便测试喵
   schedule:
       - cron: '0 16 * * *'

jobs:
  signin:
    runs-on: ubuntu-latest

    permissions:
      contents: read  # 签到只需读取代码喵
      actions: write  # 保活需要调用"启用工作流"接口喵

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'
          cache: 'maven'  # 使用官方推荐的 Maven 依赖缓存

      - name: Build and execute
        env:
          BDUSS: ${{ secrets.BDUSS }}
          SCKEY: ${{ secrets.SCKEY }}
          TID: ${{ secrets.TID }}
          CONTENT: ${{ secrets.CONTENT }}
        run: |
          mvn -B clean compile exec:java \
            -Dexec.mainClass="top.srcrs.Run" \
            -Dexec.args="$BDUSS $SCKEY"

      - name: Keepalive Workflow (API)
        if: always()  # 即使签到失败（比如 BDUSS 过期）也照样保活喵
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 机器人用 GITHUB_TOKEN 推的提交不算"仓库活动"，所以改为直接调用接口重新启用本工作流，重置60天不活跃计时喵
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/tieba.yml/enable"
          echo "保活完成喵~"
